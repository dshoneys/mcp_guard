# Shared presentation tokens (UI as Config)
# Keep key names aligned with ui/tokens.css and preview mapping.md
# Daily debug default locale: zh-CN (see doc/structurizr/I18N.md)

locale = "zh-CN"

[theme]
name = "default"
bg = "#1a1d23"
surface = "#242830"
text = "#e8eaed"
muted = "#9aa0a6"
ok = "#3dd68c"
warn = "#f5a524"
danger = "#f31260"
accent = "#6ea8fe"

# Optional overrides for status chrome (else taken from ui/i18n/{locale}.toml)
# [tray.copy]
# idle = "…"
