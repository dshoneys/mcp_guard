[package]
name = "mcp_guard"
version = "0.1.0"
edition = "2024"
description = "Local agent that scans, gates, and audits MCP / agent tool-call surfaces"
license = "MIT"
repository = "https://github.com/shinjiyu/mcp_guard"
readme = "README.md"
keywords = ["mcp", "security", "agent", "loopback"]
categories = ["command-line-utilities"]

[[bin]]
name = "mcp-guard"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
netstat2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.35", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "io-util"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
