[package]
name = "mcp_guard"
version = "0.1.0-beta.1"
edition = "2024"
description = "Local agent that scans, gates, and audits MCP / agent tool-call surfaces"
license = "MIT"
repository = "https://github.com/shinjiyu/mcp_guard"
readme = "README.md"
keywords = ["mcp", "security", "agent", "loopback"]
categories = ["command-line-utilities"]

[[bin]]
name = "mcp-guard"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.0"
anyhow = "1"
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4.3"
image = { version = "0.25", default-features = false, features = ["png"] }
netstat2 = "0.11"
notify-rust = "4"
rand = "0.10.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sysinfo = { version = "0.35", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "io-util"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tao = "0.30"
tray-icon = "0.19"
wry = "0.53"
